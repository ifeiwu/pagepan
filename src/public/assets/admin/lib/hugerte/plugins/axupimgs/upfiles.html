<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>axupimgs</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="wrap">
        <div id="topbar">
            <button class="addfile">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M11 11V5H13V11H19V13H13V19H11V13H5V11H11Z"></path></svg>
                <span>添加图片</span>
            </button>
            <button class="upall">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M4 19H20V12H22V20C22 20.5523 21.5523 21 21 21H3C2.44772 21 2 20.5523 2 20V12H4V19ZM14 9V15H10V9H5L12 2L19 9H14Z"></path></svg>
                <span>开始上传</span>
            </button>
            <button class="removeall">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17 6H22V8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8H2V6H7V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V6ZM18 8H6V20H18V8ZM13.4142 13.9997L15.182 15.7675L13.7678 17.1817L12 15.4139L10.2322 17.1817L8.81802 15.7675L10.5858 13.9997L8.81802 12.232L10.2322 10.8178L12 12.5855L13.7678 10.8178L15.182 12.232L13.4142 13.9997ZM9 4V6H15V4H9Z"></path></svg>
                <span>清空列表</span>
            </button>
        </div>
        <ul id="file_list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
